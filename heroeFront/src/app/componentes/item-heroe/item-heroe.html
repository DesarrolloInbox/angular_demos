<article class="card">
  <div class="card-image">
    <img [src]="heroe().imagen" [alt]="heroe().nombre">
  </div>
  <div class="card-content">
    @for(poder of heroe().poderes | keyvalue; track poder.key){
      <div class="stat-row">
        <span class="stat-label">{{ poder.key | titlecase}}</span>
        <div class="stat-controls">
          <button [disabled]="poder.value === 0" (click)="decrementarPoder(poder.key)">-</button>
          <span class="stat-value">{{ poder.value }}</span>
          <button [disabled]="poder.value === 100" (click)="incrementarPoder(poder.key)">+</button>
        </div>
      </div>
    }
  </div>
  <footer class="card-footer" [class.footer-villain]="esVillano()">
    <h2>{{ heroe().nombre }}</h2>
    <span>{{ esVillano() ? 'Villano' : 'Héroe' }}</span>
  </footer>
</article>
